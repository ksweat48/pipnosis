# ═══════════════════════════════════════════════════════════════════════════════
# 🚨 CRITICAL INFRASTRUCTURE - DO NOT MODIFY WITHOUT EXPLICIT APPROVAL
# ═══════════════════════════════════════════════════════════════════════════════
#
# This file configures Netlify scheduled functions that power real-time data collection.
#
# CRITICAL REQUIREMENTS:
# - ALL cron expressions MUST use 5-field format: "minute hour day month weekday"
# - DO NOT use 6-field format (with seconds) - Netlify does not support it
# - Function timeouts must accommodate cold starts (min 26 seconds for scheduled)
#
# PROTECTED FUNCTIONS:
# - hybrid-price-collector: Collects live prices every minute
# - continuous-candle-aggregator: Aggregates candles every 2 minutes
# - automatic-gap-filler: Fills missing data every 3 minutes
# - autonomous-goal-monitor: Monitors active goal sessions every minute
# - emergency-position-recovery: Safety net for stuck positions every minute
# - realtime-prices-cleanup: Cleans up stale price data every hour
#
# See: docs/CRITICAL_SYSTEMS.md for details
# ═══════════════════════════════════════════════════════════════════════════════

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SKIP_PREFLIGHT_CHECK = "true"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."get-live-price"]
  timeout = 10

[functions."openai-chat"]
  timeout = 26

[functions."scheduled-refresh"]
  timeout = 600
  schedule = "0 2 * * *"

# 🚨 CRITICAL: Server-side price collection (runs every minute)
# BREAKTHROUGH: Now collects 8 ticks per minute instead of 1 (800% improvement)
# [functions."continuous-price-collector"]
#   timeout = 26
#   schedule = "* * * * *"  # 🚨 5-field format ONLY - DO NOT add seconds field

# 🔄 HYBRID: MetaAPI + Binance 24/7 crypto support
# Provides dual-source redundancy with 24/7 crypto polling
# ENHANCED: 8s MetaAPI timeout, retry logic, health metrics logging
[functions."hybrid-price-collector"]
  timeout = 35  # Increased from 26s to 35s for retry logic
  schedule = "* * * * *"

# 🚨 CRITICAL: Candle aggregation (runs every 2 minutes)
# BREAKTHROUGH: Now includes ATR-based wick reconstruction for better chart quality
# SMART SCHEDULING: Matches 2x faster frontend polling, includes market-hours detection
[functions."continuous-candle-aggregator"]
  timeout = 120  # Increased to 120s to handle aggregation for all timeframes
  schedule = "*/2 * * * *"  # 🚨 Every 2 minutes (was 5) - matches doubled polling speed

# 🤖 AUTONOMOUS: Goal session autonomous monitor (runs every minute)
[functions."autonomous-goal-monitor"]
  timeout = 30
  schedule = "* * * * *"  # 🚨 5-field format ONLY - processes active goal sessions

# 🎯 AUTONOMOUS: Entry intent monitor (runs every minute)
# ELIMINATES BROWSER THROTTLING: Monitors entry intents server-side for true "set and forget"
# Enables trade execution even when browser is closed
[functions."autonomous-entry-monitor"]
  timeout = 30
  schedule = "* * * * *"  # 🚨 5-field format ONLY - monitors active entry intents

# 🚨 EMERGENCY: Position recovery backup monitor (runs every minute)
# CRITICAL SAFETY NET: Force-recovers stuck positions that didn't close at TP/SL
[functions."emergency-position-recovery"]
  timeout = 30
  schedule = "* * * * *"  # 🚨 5-field format ONLY - final safety net for stuck positions

# 🔧 AUTOMATIC GAP FILLER: Detects and fills gaps every 1 minute
# OPTIMIZED: Client-side filler handles 0-5min gaps, backend catches anything missed
# Works with realtime gap detector for comprehensive coverage
[functions."automatic-gap-filler"]
  timeout = 120  # 2 minutes to detect and fill gaps
  schedule = "* * * * *"  # 🚨 Every 1 minute - comprehensive backend coverage

# 🧹 CRITICAL: Automatic price data cleanup (runs every hour)
# PREVENTS STALE DATA: Removes prices older than 24 hours to prevent "Price data is XXXXs old" errors
# This function calls the database cleanup_old_realtime_prices_batch() function
[functions."realtime-prices-cleanup"]
  timeout = 60
  schedule = "0 * * * *"  # 🚨 Every hour at :00 minutes - keeps price data fresh

# 🛡️ CRITICAL: Autonomous Position Monitor (runs every minute)
# CAPITAL PROTECTION: Monitors ALL open positions for SL/TP/TP1/TP2 hits
# BREAKTHROUGH: Positions close even when browser is offline/throttled
# Primary monitoring authority - browser monitoring is view-only
[functions."autonomous-position-monitor"]
  timeout = 10  # Fast execution required for capital protection
  schedule = "* * * * *"  # 🚨 Every minute - sub-60s response time

# 🎯 AUTONOMOUS: Mid-Trade Alert Executor (runs every minute)
# AUTO-EXECUTES: Expired mid-trade alerts (EXIT_IMMEDIATELY, TAKE_PROFIT_EARLY)
# BREAKTHROUGH: Alerts execute even when browser is closed
[functions."autonomous-midtrade-executor"]
  timeout = 10  # Fast execution for time-sensitive alerts
  schedule = "* * * * *"  # 🚨 Every minute - ensures timely alert execution

# 🏥 WELLNESS: Autonomous Wellness Monitor (runs every 15 minutes)
# HEALTH CHECKS: Evaluates all open positions for drawdown levels
# TRIGGERS: Alpha/Omega analysis for positions at 30/50/70% drawdown thresholds
[functions."autonomous-wellness-monitor"]
  timeout = 120  # 2 minutes for comprehensive wellness evaluation
  schedule = "*/15 * * * *"  # 🚨 Every 15 minutes - periodic health checks

# 📊 COMPREHENSIVE BACKFILL: Backfill all timeframes for new currency pairs
[functions."backfill-all-timeframes-new-pairs"]
  timeout = 900

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = {Role = [""]}

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://pipnosis.com https://*.netlify.app https://*.supabase.co wss://*.supabase.co https://api.openai.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.agiliumtrade.ai wss://*.agiliumtrade.ai https://financialmodelingprep.com https://api.alternative.me https://api.coingecko.com https://api.kraken.com; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; child-src 'self' blob:;"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
