[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SKIP_PREFLIGHT_CHECK = "true"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."get-live-price"]
  timeout = 10

[functions."verify-metaapi-connection"]
  timeout = 10

[functions."refresh-candles"]
  timeout = 600

[functions."scheduled-refresh"]
  timeout = 600
  schedule = "0 2 * * *"

[functions."auto-fetch-candles"]
  timeout = 300

[functions."forex-candles"]
  timeout = 300

[functions."fill-candle-gaps"]
  timeout = 300
  schedule = "*/5 * * * *"

[functions."connection-health"]
  timeout = 26

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Encoding = "br"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://pipnosis.com https://*.netlify.app https://*.supabase.co wss://*.supabase.co https://api.openai.com https://*.agiliumtrade.ai wss://*.agiliumtrade.ai; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; child-src 'self' blob:;"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
