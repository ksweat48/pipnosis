  VITE_MT5_BRIDGE_URL = "ws://${MT5_BRIDGE_HOST}:${MT5_BRIDGE_PORT}"
  VITE_BUILD_VERSION = "2.0.0"
  VITE_DEV_MODE = "false"
  # Build optimizations
  NODE_OPTIONS = "--max-old-space-size=4096"
  NPM_FLAGS = "--production=false"
  # Skip TypeScript checks completely
  CI = "false"
  SKIP_PREFLIGHT_CHECK = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CRITICAL FIX: Updated CSP to allow necessary JavaScript operations and fix eval issues
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://elykntifkdaqiafnjosk.supabase.co https://pipnosis-production.up.railway.app https://api.openai.com wss://elykntifkdaqiafnjosk.supabase.co wss://localhost:* wss://api.pipnosis.com:* wss:; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; child-src 'self' blob:;"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"