# ═══════════════════════════════════════════════════════════════════════════════
# 🚨 CRITICAL INFRASTRUCTURE - DO NOT MODIFY WITHOUT EXPLICIT APPROVAL
# ═══════════════════════════════════════════════════════════════════════════════
#
# This file configures Netlify scheduled functions that power real-time data collection.
#
# CRITICAL REQUIREMENTS:
# - ALL cron expressions MUST use 5-field format: "minute hour day month weekday"
# - DO NOT use 6-field format (with seconds) - Netlify does not support it
# - Function timeouts must accommodate cold starts (min 26 seconds for scheduled)
#
# PROTECTED FUNCTIONS:
# - continuous-price-collector: Collects live prices every minute
# - continuous-candle-aggregator: Aggregates candles every 5 minutes
# - fill-candle-gaps: Fills missing data every 5 minutes
#
# See: docs/CRITICAL_SYSTEMS.md for details
# ═══════════════════════════════════════════════════════════════════════════════

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SKIP_PREFLIGHT_CHECK = "true"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."get-live-price"]
  timeout = 10

[functions."finnhub-import"]
  timeout = 120

[functions."verify-metaapi-connection"]
  timeout = 10

[functions."refresh-candles"]
  timeout = 600

[functions."scheduled-refresh"]
  timeout = 600
  schedule = "0 2 * * *"

# 🚨 CRITICAL: Server-side price collection (runs every minute)
[functions."continuous-price-collector"]
  timeout = 26
  schedule = "* * * * *"  # 🚨 5-field format ONLY - DO NOT add seconds field

# 🚨 CRITICAL: Candle aggregation (runs every 5 minutes)
[functions."continuous-candle-aggregator"]
  timeout = 60  # Increased to 60s to handle 24h lookback for all timeframes
  schedule = "*/5 * * * *"  # 🚨 5-field format ONLY - DO NOT add seconds field

# 🤖 AUTONOMOUS: Goal session autonomous monitor (runs every minute)
[functions."autonomous-goal-monitor"]
  timeout = 30
  schedule = "* * * * *"  # 🚨 5-field format ONLY - processes active goal sessions

# 🔧 AUTOMATIC GAP FILLER: Detects and fills gaps every 15 minutes
[functions."automatic-gap-filler"]
  timeout = 120  # 2 minutes to detect and fill gaps
  schedule = "*/15 * * * *"  # 🚨 5-field format ONLY - runs every 15 minutes

# 📊 Historical backfill (on-demand only, no schedule)
[functions."historical-backfill"]
  timeout = 600  # 10 minutes for large backfills

[functions."polling-health"]
  timeout = 10

[functions."openai-chat"]
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = {Role = [""]}

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://pipnosis.com https://*.netlify.app https://*.supabase.co wss://*.supabase.co https://api.openai.com https://*.agiliumtrade.ai wss://*.agiliumtrade.ai; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; child-src 'self' blob:;"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
